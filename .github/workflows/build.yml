name: Build Windows EXE

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "AI招聘工作台" --add-data "app/templates;app/templates" --add-data "app/static;app/static" --add-data "extension;extension" entry.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI招聘工作台-windows-exe
          path: dist/AI招聘工作台.exe
