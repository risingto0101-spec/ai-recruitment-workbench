<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI 招聘工作台{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-logo">AI</div>
                <div class="brand-name">招聘工作台</div>
            </div>
            <nav class="nav">
                <a href="/jobs" class="nav-item {% if active == 'jobs' %}active{% endif %}">
                    <span class="nav-icon">&#128188;</span>
                    <span>岗位管理</span>
                </a>
                <a href="/candidates" class="nav-item {% if active == 'candidates' %}active{% endif %}">
                    <span class="nav-icon">&#128100;</span>
                    <span>录入候选人</span>
                </a>
                <a href="/talent-pool" class="nav-item {% if active == 'talent-pool' %}active{% endif %}">
                    <span class="nav-icon">&#128240;</span>
                    <span>人才库</span>
                </a>
                <a href="/dashboard" class="nav-item {% if active == 'dashboard' %}active{% endif %}">
                    <span class="nav-icon">&#128200;</span>
                    <span>数据看板</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <span id="ai-status" class="ai-status ai-off">规则引擎</span>
            </div>
        </aside>
        <main class="main">
            {% block content %}{% endblock %}
        </main>
    </div>
    <div id="toast" class="toast"></div>
    <script>
        async function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            setTimeout(() => { toast.className = 'toast'; }, 3000);
        }

        async function getJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('请求失败');
            return res.json();
        }

        async function postJSON(url, body) {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) throw new Error('请求失败');
            return res.json();
        }

        async function deleteReq(url) {
            const res = await fetch(url, { method: 'DELETE' });
            if (!res.ok) throw new Error('请求失败');
            return res.json();
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
