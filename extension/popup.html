<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI招聘工作台</title>
    <style>
        body { width: 280px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; margin: 0; }
        .header { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #1e293b; }
        .info { font-size: 13px; color: #64748b; margin-bottom: 12px; }
        .btn { width: 100%; padding: 10px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; }
        .btn-primary { background: #2563eb; color: #fff; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn:disabled { background: #cbd5e1; cursor: not-allowed; }
        .status { margin-top: 12px; font-size: 13px; padding: 8px; border-radius: 6px; display: none; }
        .status.success { background: #dcfce7; color: #166534; display: block; }
        .status.error { background: #fee2e2; color: #991b1b; display: block; }
        .status.info { background: #eff6ff; color: #1e40af; display: block; }
        .link { margin-top: 12px; font-size: 12px; text-align: center; }
        .link a { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="header">AI 招聘工作台</div>
    <div class="info" id="page-info">正在识别页面...</div>
    <button class="btn btn-primary" id="push-btn" disabled>一键推送简历</button>
    <div class="status" id="status"></div>
    <div class="link"><a href="http://127.0.0.1:8000" target="_blank">打开工作台</a></div>
    <script src="popup.js"></script>
</body>
</html>
